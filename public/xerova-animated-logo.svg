<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cyberCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#38bdf8;#06b6d4;#00f0ff" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#6366f1;#2563eb;#3b82f6" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="cyberBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <radialGradient id="cyberCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="particleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes spinClockwise {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinCounterClockwise {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes pulseBreath {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.03); opacity: 1; filter: drop-shadow(0 0 16px rgba(0,240,255,0.7)); }
      }
      @keyframes floatParticle1 {
        0%, 100% { transform: translate(0px, 0px); opacity: 0.3; }
        50% { transform: translate(6px, -8px); opacity: 0.9; }
      }
      @keyframes floatParticle2 {
        0%, 100% { transform: translate(0px, 0px); opacity: 0.4; }
        50% { transform: translate(-7px, 6px); opacity: 1; }
      }
      @keyframes floatParticle3 {
        0%, 100% { transform: translate(0px, 0px); opacity: 0.2; }
        50% { transform: translate(5px, 7px); opacity: 0.85; }
      }
      @keyframes radarSweep {
        0% { opacity: 0.15; transform: rotate(0deg); }
        50% { opacity: 0.5; }
        100% { opacity: 0.15; transform: rotate(360deg); }
      }
      .orbit-ring-1 {
        transform-origin: 100px 100px;
        animation: spinClockwise 22s linear infinite;
      }
      .orbit-ring-2 {
        transform-origin: 100px 100px;
        animation: spinCounterClockwise 32s linear infinite;
      }
      .logo-emblem {
        transform-origin: 100px 100px;
        animation: pulseBreath 4s ease-in-out infinite;
      }
      .p1 { animation: floatParticle1 3.5s ease-in-out infinite; }
      .p2 { animation: floatParticle2 4.2s ease-in-out infinite; }
      .p3 { animation: floatParticle3 2.8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Ambient Glow -->
  <circle cx="100" cy="100" r="92" fill="url(#cyberCenterGlow)" />

  <!-- Outer Orbit Rings with Particles -->
  <g class="orbit-ring-1">
    <circle cx="100" cy="100" r="90" stroke="#00f0ff" stroke-width="1" stroke-dasharray="4 14" opacity="0.4" />
    <circle cx="190" cy="100" r="2.5" fill="#00f0ff" filter="url(#particleGlow)" />
    <circle cx="10" cy="100" r="2" fill="#38bdf8" filter="url(#particleGlow)" />
    <circle cx="100" cy="190" r="2" fill="#00f0ff" filter="url(#particleGlow)" />
    <circle cx="100" cy="10" r="2.5" fill="#818cf8" filter="url(#particleGlow)" />
  </g>

  <!-- Secondary Counter-Rotating Ring with Particle Clusters -->
  <g class="orbit-ring-2">
    <circle cx="100" cy="100" r="80" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="2 18" opacity="0.5" />
    <circle cx="156.5" cy="43.5" r="2.5" fill="#22d3ee" filter="url(#particleGlow)" />
    <circle cx="43.5" cy="156.5" r="2" fill="#60a5fa" filter="url(#particleGlow)" />
    <circle cx="43.5" cy="43.5" r="1.8" fill="#38bdf8" />
    <circle cx="156.5" cy="156.5" r="2.2" fill="#00f0ff" filter="url(#particleGlow)" />
  </g>

  <!-- Floating Constellation Ambient Particles -->
  <g filter="url(#particleGlow)">
    <circle cx="32" cy="78" r="1.5" fill="#00f0ff" class="p1" />
    <circle cx="168" cy="122" r="1.5" fill="#38bdf8" class="p2" />
    <circle cx="68" cy="24" r="1.2" fill="#60a5fa" class="p3" />
    <circle cx="132" cy="176" r="1.4" fill="#00f0ff" class="p1" />
    <circle cx="172" cy="62" r="1.6" fill="#818cf8" class="p2" />
    <circle cx="28" cy="138" r="1.3" fill="#22d3ee" class="p3" />
  </g>

  <!-- Inner Cyber Nodes / Grid Marks -->
  <g stroke="#00f0ff" stroke-width="0.75" opacity="0.3">
    <line x1="100" y1="2" x2="100" y2="12" />
    <line x1="100" y1="188" x2="100" y2="198" />
    <line x1="2" y1="100" x2="12" y2="100" />
    <line x1="188" y1="100" x2="198" y2="100" />
  </g>

  <!-- XEROVA Emblem with Glowing Pulse -->
  <g class="logo-emblem" filter="url(#neonGlow)">
    <g transform="translate(28, 27)">
      <!-- Main Right Wing / Upper Branch -->
      <path d="M143.07 82.09V66.33 20.12c0-1.13-.28-1.54-1.5-1.53-4.52.08-9 .1-13.56 0a3.35 3.35 0 0 0-3.16 1.61c-2.41 3.55-4.88 7.07-7.24 10.66-4 6-7.78 12.19-11.79 18.2Q98 60.8 90.35 72.67a1.76 1.76 0 0 0 0 2.3c.85 1.07 1.48 2.29 2.23 3.42 4.79 7.25 9.47 14.56 14.22 21.83 5 7.72 10.08 15.42 15.11 23.14.31.47.86 1 .62 1.53s-1 .27-1.57.27h-32a2.67 2.67 0 0 1-2.58-1.32c-2.37-3.64-4.78-7.26-7.17-10.89-2.51-3.81-5-7.63-7.51-11.43-.79-1.19-1.21-1.18-2 .06-.52.78-.94 1.63-1.46 2.42q-6.15 9.39-12.24 18.71-6.41 9.8-12.77 19.62c-.56.86-1.85 1.8-1.44 2.62.51 1 2 .41 3.08.41h96.35c1.55 0 1.94-.45 1.93-1.95q-.15-30.65-.08-61.32z" fill="url(#cyberCyanGrad)" />

      <!-- Main Left Wing / Lower Branch -->
      <path d="M50.77 0H1.72C.23 0 0 .54 0 1.83v123c0 1-.13 1.88 1.37 1.86 4.84-.06 9.67 0 14.51 0a2 2 0 0 0 1.71-.91c1.52-1.94 2.81-4 4.16-6.09 6-9 11.93-18 17.71-27.18 4.17-6.6 8.54-13.08 12.87-19.57a2.35 2.35 0 0 0-.08-2.9C48.19 63.74 44 57.53 40 51.17c-3.59-5.8-7.26-11.56-11-17.26q-3.83-5.76-7.56-11.56c-.32-.5-.81-1.1-.42-1.73s1-.37 1.6-.36c10.3 0 20.61.12 30.91 0a4.18 4.18 0 0 1 3.82 2.19c1.44 2.11 2.8 4.27 4.2 6.4q5 7.54 9.91 15.07c.75 1.14 1.11 1.08 1.87-.08q6-9.12 11.94-18.23c1.47-2.22 3-4.42 4.43-6.65q5.58-8.53 11.09-17.11c.3-.46 1-.9.66-1.49s-1-.34-1.59-.34z" fill="url(#cyberCyanGrad)" />

      <!-- Shadow & Secondary Depth Overlays -->
      <path d="M143.07 82.09v61.35c0 1.5-.38 1.95-1.93 1.95q-48.18-.06-96.35 0c-1.07 0-2.57.62-3.08-.41-.41-.82.88-1.76 1.44-2.62q6.36-9.83 12.77-19.62 6.12-9.34 12.26-18.67c.52-.79.94-1.64 1.46-2.42.83-1.24 1.25-1.25 2-.06 2.51 3.8 5 7.62 7.51 11.43 2.39 3.63 4.8 7.25 7.17 10.89A2.67 2.67 0 0 0 89 125.2h32c.53 0 1.3.33 1.57-.27s-.31-1.06-.62-1.53c-5-7.72-10.09-15.42-15.11-23.14-4.76-7.26-9.44-14.62-14.23-21.87-.75-1.13-1.38-2.39-2.23-3.39a1.76 1.76 0 0 1 0-2.3Q98 60.81 105.85 49.05c4-6 7.83-12.15 11.79-18.2 2.36-3.59 4.83-7.11 7.24-10.66a3.35 3.35 0 0 1 3.12-1.61c4.52.11 9 .09 13.56 0 1.22 0 1.51.4 1.5 1.53V82.09z" fill="url(#cyberBlueGrad)" opacity="0.85" />
    </g>
  </g>
</svg>